name: Node.js CI
on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Setup node
              uses: actions/setup-node@v6
              with:
                  node-version: 24.x
            - run: npm ls
            - run: npm ci
            - run: npm run build --if-present
            - run: npm test

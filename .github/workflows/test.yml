name: Node.js CI
on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Setup node
              uses: actions/setup-node@v6
              with:
                  node-version: 24.x
            - name: Test Project
              run: |
                  npm ci
                  npm ls
                  npm test
              # FIXME: This always produces diffs of little numbers, and I have no idea why.
            - name: Validate dist
              run: |
                  npm i -g @vercel/ncc
                  npm run build
                  ncc build out/index.js -o dist
                  cp dist/index.js dist/index_pr.js
                  ncc build out/index.js -o dist
                  diff dist/index.js dist/index_pr.js
                  if [ $? -ne 0 ]; then
                    echo "Files differ!"
                    exit 1
                  fi

name: Node.js CI
on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Setup node
              uses: actions/setup-node@v6
              with:
                  node-version: 24.x
            - name: Install dependencies
              run: |
                  npm ci
                  npm ls
            - name: Run Test
              run: npm run test
            - name: Validate dist
              run: |
                  cp dist/index.js index_pr.js
                  rm -r dist
                  npm install --global rollup
                  npm run build
                  npm run package
                  echo "Files should not differ but even if they do"
                  echo "It's a non blocking issue as files made in windows still work on ubuntu github action runner"
                  echo "This just checks for basic consistency which is good but not always nessassary"
                  diff dist/index.js index_pr.js || true
